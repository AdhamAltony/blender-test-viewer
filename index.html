<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImpressIV — 3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #app { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }
    .panel {
      position: absolute; z-index: 10;
      color: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: rgba(17,17,17,0.78); backdrop-filter: blur(6px);
      border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 14px 16px; line-height: 1.5;
    }
    #info { top: 16px; left: 16px; max-width: 340px; font-size: 13px; }
    #info h1 { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #fff; }
    #info .file { color: #8ad; font-size: 12px; word-break: break-all; }
    #info .hint { color: #888; font-size: 11px; margin-top: 8px; line-height: 1.8; }
    #info .hint b { color: #bbb; }
    #drophint { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #999; text-align: center; }
    #drophint b { color: #ccc; }
    #loading {
      position: absolute; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: rgba(17,17,17,0.7); color: #fff;
      font-family: -apple-system, sans-serif; font-size: 15px;
    }
    #loading.show { display: flex; }
    .spinner { width: 38px; height: 38px; border: 3px solid #333; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #progress { font-size: 13px; color: #9bd; }
    #dragmask {
      position: absolute; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: rgba(37,99,235,0.18); border: 4px dashed #2563eb;
      color: #fff; font-family: -apple-system, sans-serif; font-size: 22px; font-weight: 700;
      pointer-events: none;
    }
    #dragmask.show { display: flex; }
    #error {
      position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 25; display: none;
      background: #3a1212; border: 1px solid #7a2222; color: #ffcaca;
      font-family: -apple-system, sans-serif; font-size: 13px; padding: 12px 14px; border-radius: 8px;
      max-width: 520px;
    }
    #error.show { display: block; }
    input[type="file"] { display: none; }
    .lil-gui { --width: 320px; z-index: 12; }
  </style>
</head>
<body>
  <div id="app">
    <div id="info" class="panel">
      <h1>ImpressIV — 3D Model Viewer</h1>
      <div class="file" id="filename">Loading default model…</div>
      <div class="hint">
        Orbit: left-drag &nbsp;·&nbsp; Pan: right-drag &nbsp;·&nbsp; Zoom: scroll<br />
        <b>Click</b> a sphere or diamond to select it<br />
        <b>Click &amp; drag</b> it to move it in 3D space
      </div>
    </div>
    <input type="file" id="fileinput" accept=".glb,.gltf" />
    <div id="drophint" class="panel">Drag &amp; drop a <b>.glb</b> file anywhere to view it</div>
    <div id="loading"><div class="spinner"></div><div>Loading model…</div><div id="progress"></div></div>
    <div id="dragmask">Drop your .glb here</div>
    <div id="error"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls }   from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader }      from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader }     from "three/addons/loaders/DRACOLoader.js";
    import { KTX2Loader }      from "three/addons/loaders/KTX2Loader.js";
    import { MeshoptDecoder }  from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { ViewHelper }      from "three/addons/helpers/ViewHelper.js";
    import { GUI }             from "three/addons/libs/lil-gui.module.min.js";

    const DEFAULT_MODEL = "models/Hall_1_Cleaned_Test_2.glb";
    const SETTINGS_KEY  = "impressiv-viewer-settings-v2";
    const LIGHTS_KEY    = "impressiv-viewer-lights-v4";
    const el = (id) => document.getElementById(id);

    // ── Settings ──────────────────────────────────────────────────────────────
    const defaults = {
      autoRotate: false, autoRotateSpeed: 1.0,
      ambientOn: true, ambientIntensity: 0.5, ambientColor: "#ffffff",
      sunOn: true, sunIntensity: 1.5, sunColor: "#ffffff", sunX: 1, sunY: 2, sunZ: 1,
      envOn: true, envIntensity: 1.0, envPreset: "Studio",
      background: "Dark", bgColor: "#111111",
      gridVisible: true, wireframe: false,
      toneMapping: "ACES Filmic", exposure: 1.0,
    };
    let params = Object.assign({}, defaults);
    try { params = Object.assign(params, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (_) {}
    const saveSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(params)); } catch (_) {} };

    const TONE = {
      "None": THREE.NoToneMapping, "Linear": THREE.LinearToneMapping,
      "Reinhard": THREE.ReinhardToneMapping, "Cineon": THREE.CineonToneMapping,
      "ACES Filmic": THREE.ACESFilmicToneMapping, "AgX": THREE.AgXToneMapping, "Neutral": THREE.NeutralToneMapping,
    };

    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.autoClear = false;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    el("app").appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500000);
    camera.position.set(0, 500, 1000);

    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    function makeGradientEnv(stops) {
      const W = 256, H = 128;
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx  = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      stops.forEach(([t, c]) => grad.addColorStop(t, c));
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      const tex = new THREE.CanvasTexture(canvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const out = pmrem.fromEquirectangular(tex).texture;
      tex.dispose();
      return out;
    }

    const ENV_MAPS = {
      "Studio":         pmrem.fromScene(new RoomEnvironment(), 0.04).texture,
      "Outdoor Day":    makeGradientEnv([[0,"#1b4fa8"],[0.35,"#6ab4f5"],[0.52,"#e8c97a"],[1,"#c87840"]]),
      "Sunset":         makeGradientEnv([[0,"#0d0520"],[0.3,"#7a1a08"],[0.5,"#d84800"],[0.65,"#f07820"],[1,"#f09840"]]),
      "Overcast":       makeGradientEnv([[0,"#5a6068"],[0.5,"#7a8088"],[1,"#8a9098"]]),
      "Indoor Neutral": makeGradientEnv([[0,"#5a4838"],[0.4,"#9a8068"],[1,"#b09878"]]),
      "Minimal":        makeGradientEnv([[0,"#383838"],[1,"#484848"]]),
    };
    const ENV_PRESET_NAMES = Object.keys(ENV_MAPS);

    const ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
    const sun     = new THREE.DirectionalLight(0xffffff, 1.5); scene.add(sun);

    const grid = new THREE.GridHelper(10000, 200, 0x444444, 0x2a2a2a);
    grid.material.transparent = true; grid.material.opacity = 0.6;
    scene.add(grid);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;

    const viewHelper = new ViewHelper(camera, renderer.domElement);

    // ── Handle geometry ───────────────────────────────────────────────────────
    const BULB_GEO   = new THREE.SphereGeometry(1, 16, 16);
    const RING_GEO   = new THREE.TorusGeometry(1.4, 0.12, 8, 32);
    const TARGET_GEO = new THREE.OctahedronGeometry(1, 0);

    // ── Positional lights ─────────────────────────────────────────────────────
    let sceneDim    = 100;
    let bulbSizeMul = 0.010;
    const lights    = [];
    let selectedLight = null;

    const bulbScale   = () => Math.max(sceneDim * bulbSizeMul, 0.3);
    const targetScale = () => Math.max(sceneDim * bulbSizeMul * 0.7, 0.2);

    // ── Drag state ────────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const _plane    = new THREE.Plane();
    const _hit      = new THREE.Vector3();
    const _offset   = new THREE.Vector3();
    const _norm     = new THREE.Vector3();
    let   dragState = null;
    let   dragMode  = "camera";

    function getMouse(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      return new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width)  * 2 - 1,
        -((e.clientY - rect.top)  / rect.height) * 2 + 1,
      );
    }

    function buildDragPlane(targetObj) {
      if (dragMode === "horizontal") {
        _plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), targetObj.position);
      } else if (dragMode === "vertical") {
        _norm.copy(camera.position).sub(targetObj.position);
        _norm.y = 0; _norm.normalize();
        _plane.setFromNormalAndCoplanarPoint(_norm, targetObj.position);
      } else {
        _norm.copy(camera.position).sub(targetObj.position).normalize();
        _plane.setFromNormalAndCoplanarPoint(_norm, targetObj.position);
      }
    }

    // ── Spawn / destroy ───────────────────────────────────────────────────────
    function spawnLight(type = "Point", hexColor = "#ffffff", intensity = 4, opts = {}) {
      const {
        distance = 0, castShadow = false, shadowMapSize = 1024,
        angle = 0.45, penumbra = 0.3, decay = 2,
        shadowBias = -0.0005, shadowRadius = 1,
        position = null, targetPos = null, enabled = true,
      } = opts;

      const s  = bulbScale();
      const ts = targetScale();
      const spread = sceneDim * 0.15;

      const group = new THREE.Group();
      group.position.fromArray(position ?? [
        (Math.random() - 0.5) * spread, sceneDim * 0.45, (Math.random() - 0.5) * spread,
      ]);

      const bulbMat  = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.5, depthWrite: false });
      const bulbMesh = new THREE.Mesh(BULB_GEO, bulbMat);
      bulbMesh.scale.setScalar(s);
      group.add(bulbMesh);

      const ringMat  = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.25, depthWrite: false });
      const ringMesh = new THREE.Mesh(RING_GEO, ringMat);
      ringMesh.scale.setScalar(s); ringMesh.rotation.x = Math.PI / 2;
      group.add(ringMesh);

      let light, targetGroup = null, targetMesh = null, targetMat = null, helper = null;

      if (type === "Spot") {
        light = new THREE.SpotLight(new THREE.Color(hexColor), intensity, distance, angle, penumbra, decay);
        targetGroup = new THREE.Group();
        targetGroup.position.fromArray(targetPos ?? [0, 0, 0]);
        targetMat  = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.6, depthWrite: false, wireframe: true });
        targetMesh = new THREE.Mesh(TARGET_GEO, targetMat);
        targetMesh.scale.setScalar(ts);
        targetGroup.add(targetMesh);
        scene.add(targetGroup);
        light.target = targetGroup;
        light.shadow.mapSize.set(shadowMapSize, shadowMapSize);
        light.shadow.camera.near = 0.5;
        light.shadow.camera.far  = sceneDim * 3;
        light.shadow.camera.fov  = angle * (180 / Math.PI) * 2;
        light.shadow.camera.updateProjectionMatrix();
        light.shadow.bias   = shadowBias;
        light.shadow.radius = shadowRadius;
        helper = new THREE.SpotLightHelper(light);
        helper.visible = false;
        scene.add(helper);
      } else {
        light = new THREE.PointLight(new THREE.Color(hexColor), intensity, distance, decay);
        light.shadow.mapSize.set(shadowMapSize, shadowMapSize);
        light.shadow.camera.near = 0.5;
        light.shadow.camera.far  = sceneDim * 3;
        light.shadow.bias   = shadowBias;
        light.shadow.radius = shadowRadius;
      }

      light.castShadow = castShadow;
      light.visible    = enabled;
      group.add(light);
      scene.add(group);

      const entry = { group, bulbMesh, bulbMat, ringMesh, ringMat, light, type, targetGroup, targetMesh, targetMat, helper };
      lights.push(entry);
      return entry;
    }

    function destroyLight(entry) {
      if (!entry) return;
      const i = lights.indexOf(entry);
      if (i === -1) return;
      lights.splice(i, 1);
      if (entry.targetGroup) scene.remove(entry.targetGroup);
      if (entry.helper)      scene.remove(entry.helper);
      scene.remove(entry.group);
      if (selectedLight === entry) {
        selectedLight = null;
        if (lights.length) selectLight(lights[lights.length - 1]);
        else syncSelGui();
      }
      saveLights();
    }

    function duplicateLight(entry) {
      if (!entry) return;
      const l = entry.light;
      const clone = spawnLight(entry.type, "#" + l.color.getHexString(), l.intensity, {
        distance: l.distance, castShadow: l.castShadow,
        shadowMapSize: l.shadow?.mapSize.x ?? 1024,
        angle: entry.type === "Spot" ? l.angle : 0.45,
        penumbra: entry.type === "Spot" ? l.penumbra : 0.3,
        decay: l.decay, shadowBias: l.shadow?.bias ?? -0.0005,
        shadowRadius: l.shadow?.radius ?? 1,
        position: entry.group.position.toArray().map((v, i) => v + (i === 0 ? sceneDim * 0.05 : 0)),
        targetPos: entry.targetGroup ? entry.targetGroup.position.toArray() : null,
        enabled: l.visible,
      });
      selectLight(clone);
      saveLights();
    }

    function selectLight(entry) {
      selectedLight = entry;
      lights.forEach((l) => {
        const sel = l === entry;
        l.bulbMat.opacity  = sel ? 1.0  : 0.4;
        l.ringMat.opacity  = sel ? 0.6  : 0.2;
        if (l.targetMat) l.targetMat.opacity = sel ? 0.9 : 0.3;
      });
      syncSelGui();
    }

    function rescaleBulbs() {
      const s = bulbScale(), ts = targetScale();
      lights.forEach(({ bulbMesh, ringMesh, targetMesh, light }) => {
        bulbMesh.scale.setScalar(s);
        ringMesh.scale.setScalar(s);
        if (targetMesh) targetMesh.scale.setScalar(ts);
        if (light.shadow) { light.shadow.camera.far = sceneDim * 3; light.shadow.camera.updateProjectionMatrix(); }
      });
    }

    // ── Drag-to-move ──────────────────────────────────────────────────────────
    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      raycaster.setFromCamera(getMouse(e), camera);
      const pool = [
        ...lights.map(l => ({ obj: l.group,       entry: l })),
        ...lights.filter(l => l.targetMesh).map(l => ({ obj: l.targetGroup, entry: l })),
      ];
      const meshes = pool.map(p => p.obj === p.entry.group ? p.entry.bulbMesh : p.entry.targetMesh);
      const hits = raycaster.intersectObjects(meshes, false);
      if (!hits.length) return;

      const idx   = meshes.indexOf(hits[0].object);
      const found = pool[idx];
      selectLight(found.entry);
      buildDragPlane(found.obj);
      raycaster.ray.intersectPlane(_plane, _hit);
      _offset.copy(found.obj.position).sub(_hit);
      dragState = { targetObj: found.obj, startX: e.clientX, startY: e.clientY, active: false };
      controls.enabled = false;
      e.stopPropagation();
    });

    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!dragState) {
        raycaster.setFromCamera(getMouse(e), camera);
        const meshes = [
          ...lights.map(l => l.bulbMesh),
          ...lights.filter(l => l.targetMesh).map(l => l.targetMesh),
        ];
        renderer.domElement.style.cursor = raycaster.intersectObjects(meshes, false).length ? "grab" : "default";
        return;
      }
      const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
      if (!dragState.active && Math.sqrt(dx * dx + dy * dy) < 4) return;
      dragState.active = true;
      renderer.domElement.style.cursor = "grabbing";
      raycaster.setFromCamera(getMouse(e), camera);
      if (raycaster.ray.intersectPlane(_plane, _hit)) {
        if (dragMode === "vertical") {
          dragState.targetObj.position.y = _hit.y + _offset.y;
        } else {
          dragState.targetObj.position.copy(_hit).add(_offset);
        }
      }
      syncPosGui();
    });

    renderer.domElement.addEventListener("pointerup", () => {
      if (dragState) {
        controls.enabled = true;
        renderer.domElement.style.cursor = "default";
        if (dragState.active) { saveLights(); syncSelGui(); }
        dragState = null;
      }
    });

    // ── Persist ───────────────────────────────────────────────────────────────
    function saveLights() {
      try {
        localStorage.setItem(LIGHTS_KEY, JSON.stringify(lights.map(e => ({
          type: e.type, color: "#" + e.light.color.getHexString(),
          intensity: e.light.intensity, position: e.group.position.toArray(),
          distance: e.light.distance, castShadow: e.light.castShadow,
          shadowMapSize: e.light.shadow?.mapSize.x ?? 1024,
          decay: e.light.decay, shadowBias: e.light.shadow?.bias ?? -0.0005,
          shadowRadius: e.light.shadow?.radius ?? 1,
          enabled: e.light.visible,
          angle:    e.type === "Spot" ? e.light.angle    : undefined,
          penumbra: e.type === "Spot" ? e.light.penumbra : undefined,
          targetPos: e.targetGroup ? e.targetGroup.position.toArray() : undefined,
        }))));
      } catch (_) {}
    }
    function loadSavedLights() { try { return JSON.parse(localStorage.getItem(LIGHTS_KEY) || "null"); } catch (_) { return null; } }
    function restoreLights(data) {
      data.forEach(d => spawnLight(d.type, d.color, d.intensity, {
        distance: d.distance ?? 0, castShadow: d.castShadow ?? false,
        shadowMapSize: d.shadowMapSize ?? 1024, angle: d.angle ?? 0.45,
        penumbra: d.penumbra ?? 0.3, decay: d.decay ?? 2,
        shadowBias: d.shadowBias ?? -0.0005, shadowRadius: d.shadowRadius ?? 1,
        position: d.position, targetPos: d.targetPos, enabled: d.enabled !== false,
      }));
      if (lights.length) selectLight(lights[0]);
    }

    // ── Scene apply ───────────────────────────────────────────────────────────
    function applyLights() {
      ambient.visible = params.ambientOn; ambient.intensity = params.ambientIntensity; ambient.color.set(params.ambientColor);
      sun.visible = params.sunOn; sun.intensity = params.sunIntensity; sun.color.set(params.sunColor);
      sun.position.set(params.sunX, params.sunY, params.sunZ);
    }
    function applyEnv()  { scene.environment = params.envOn ? (ENV_MAPS[params.envPreset] ?? ENV_MAPS["Studio"]) : null; applyMaterials(); }
    function applyBackground() {
      if      (params.background === "Transparent") scene.background = null;
      else if (params.background === "Light")       scene.background = new THREE.Color(0xcfd4da);
      else if (params.background === "Custom")      scene.background = new THREE.Color(params.bgColor);
      else                                          scene.background = new THREE.Color(0x111111);
    }
    function applyToneMapping() {
      renderer.toneMapping = TONE[params.toneMapping] ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      applyMaterials();
    }
    function applyMaterials() {
      if (!current) return;
      current.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        o.castShadow = o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if ("wireframe"       in m) m.wireframe       = params.wireframe;
          if ("envMapIntensity" in m) m.envMapIntensity = params.envIntensity;
          m.needsUpdate = true;
        });
      });
    }
    function applyGrid()       { grid.visible = params.gridVisible; }
    function applyAutoRotate() { controls.autoRotate = params.autoRotate; controls.autoRotateSpeed = params.autoRotateSpeed; }
    function applyAll()        { applyLights(); applyEnv(); applyBackground(); applyToneMapping(); applyGrid(); applyAutoRotate(); }

    // ── Loading ───────────────────────────────────────────────────────────────
    const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/libs/draco/");
    const ktx2  = new KTX2Loader().setTranscoderPath("https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/libs/basis/").detectSupport(renderer);
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco); loader.setKTX2Loader(ktx2); loader.setMeshoptDecoder(MeshoptDecoder);

    let current = null, lastFrame = null;
    const setLoading = (on, text = "") => { el("loading").classList.toggle("show", on); el("progress").textContent = text; };
    function showError(msg) { const e = el("error"); e.textContent = "⚠ " + msg; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 8000); }

    function frameObject(obj) {
      const box    = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      obj.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      sceneDim = maxDim;
      const fov  = camera.fov * Math.PI / 180;
      const dist = (maxDim / 2) / Math.tan(fov / 2) * 1.5;
      camera.position.set(dist * 0.6, dist * 0.4, dist * 0.6);
      camera.near = maxDim * 0.001; camera.far = maxDim * 10;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0); controls.update();
      lastFrame = { pos: camera.position.clone(), near: camera.near, far: camera.far };
      rescaleBulbs();
      lights.forEach(({ group }) => group.position.set(0, sceneDim * 0.45, 0));
      // Update position slider range
      const R = maxDim * 1.5;
      [posCtrlX, posCtrlY, posCtrlZ, tgtCtrlX, tgtCtrlY, tgtCtrlZ].forEach(c => {
        if (c) { c.min(-R).max(R); c.updateDisplay(); }
      });
    }

    function clearCurrent() {
      if (!current) return;
      scene.remove(current);
      current.traverse(o => {
        o.geometry?.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose?.());
      });
      current = null;
    }

    function onLoaded(gltf, label) {
      clearCurrent();
      current = gltf.scene || gltf.scenes[0];
      scene.add(current);
      frameObject(current);
      applyMaterials();
      el("filename").textContent = label;
      setLoading(false);
    }

    function loadFromURL(url, label) {
      setLoading(true);
      loader.load(url, g => onLoaded(g, label),
        xhr => setLoading(true, xhr.lengthComputable ? Math.round(xhr.loaded / xhr.total * 100) + "%" : (xhr.loaded / 1048576).toFixed(1) + " MB"),
        err => { setLoading(false); showError("Could not load. " + (err?.message || "")); console.error(err); });
    }
    function loadFromFile(file) {
      const url = URL.createObjectURL(file);
      setLoading(true);
      loader.load(url, g => { onLoaded(g, file.name); URL.revokeObjectURL(url); },
        xhr => setLoading(true, (xhr.loaded / 1048576).toFixed(1) + " MB"),
        err => { setLoading(false); URL.revokeObjectURL(url); showError('Could not load "' + file.name + '".'); console.error(err); });
    }

    // ── GUI ───────────────────────────────────────────────────────────────────
    const gui = new GUI({ title: "⚙ Settings" });

    // Model & View
    const fModel = gui.addFolder("Model & View");
    fModel.add({ o: () => el("fileinput").click() }, "o").name("📂 Open a model…");
    fModel.add({ r: () => { if (lastFrame) { camera.position.copy(lastFrame.pos); camera.near = lastFrame.near; camera.far = lastFrame.far; camera.updateProjectionMatrix(); controls.target.set(0,0,0); controls.update(); } } }, "r").name("↺ Reset camera");
    fModel.add(params, "autoRotate").name("Auto-rotate").onChange(() => { applyAutoRotate(); saveSettings(); });
    fModel.add(params, "autoRotateSpeed", 0.1, 8, 0.1).name("Rotate speed").onChange(() => { applyAutoRotate(); saveSettings(); });

    // Ambient
    const fAmb = gui.addFolder("Ambient Light");
    fAmb.add(params, "ambientOn").name("Enabled").onChange(() => { applyLights(); saveSettings(); });
    fAmb.add(params, "ambientIntensity", 0, 5, 0.05).name("Intensity").onChange(() => { applyLights(); saveSettings(); });
    fAmb.addColor(params, "ambientColor").name("Color").onChange(() => { applyLights(); saveSettings(); });

    // Sun
    const fSun = gui.addFolder("Sun / Directional");
    fSun.add(params, "sunOn").name("Enabled").onChange(() => { applyLights(); saveSettings(); });
    fSun.add(params, "sunIntensity", 0, 10, 0.05).name("Intensity").onChange(() => { applyLights(); saveSettings(); });
    fSun.addColor(params, "sunColor").name("Color").onChange(() => { applyLights(); saveSettings(); });
    fSun.add(params, "sunX", -10, 10, 0.1).name("Direction X").onChange(() => { applyLights(); saveSettings(); });
    fSun.add(params, "sunY", -10, 10, 0.1).name("Direction Y").onChange(() => { applyLights(); saveSettings(); });
    fSun.add(params, "sunZ", -10, 10, 0.1).name("Direction Z").onChange(() => { applyLights(); saveSettings(); });

    // Environment
    const fEnv = gui.addFolder("Environment (IBL)");
    fEnv.add(params, "envOn").name("Enabled").onChange(() => { applyEnv(); saveSettings(); });
    fEnv.add(params, "envPreset", ENV_PRESET_NAMES).name("Preset").onChange(() => { applyEnv(); saveSettings(); });
    fEnv.add(params, "envIntensity", 0, 4, 0.05).name("Strength").onChange(() => { applyMaterials(); saveSettings(); });

    // ── Positional Lights ─────────────────────────────────────────────────────
    const fPL = gui.addFolder("Positional Lights");

    // Global light management controls
    const handleCtrl = { size: 1.0 };
    fPL.add(handleCtrl, "size", 0.1, 5.0, 0.05).name("Handle size ×").onChange(v => {
      bulbSizeMul = 0.010 * v; rescaleBulbs();
    });

    const dragModes = { mode: "Camera plane" };
    fPL.add(dragModes, "mode", ["Camera plane", "Horizontal (XZ)", "Vertical (Y only)"])
      .name("Drag plane")
      .onChange(v => {
        if (v === "Camera plane")         dragMode = "camera";
        else if (v === "Horizontal (XZ)") dragMode = "horizontal";
        else                              dragMode = "vertical";
      });

    const plA = {
      addPoint:  () => { selectLight(spawnLight("Point", sel.color, sel.intensity)); saveLights(); },
      addSpot:   () => { selectLight(spawnLight("Spot",  sel.color, sel.intensity)); saveLights(); },
      duplicate: () => duplicateLight(selectedLight),
      remove:    () => destroyLight(selectedLight),
      clearAll:  () => { while (lights.length) destroyLight(lights[0]); },
    };
    fPL.add(plA, "addPoint").name("＋ Add Point Light");
    fPL.add(plA, "addSpot").name("＋ Add Spot Light");
    fPL.add(plA, "duplicate").name("⧉ Duplicate Selected");
    fPL.add(plA, "remove").name("✕ Remove Selected");
    fPL.add(plA, "clearAll").name("✕✕ Clear All Lights");

    // ── Selected Light ────────────────────────────────────────────────────────
    const sel = {
      type: "—",
      // state
      enabled: true, color: "#ffffff", intensity: 4, distance: 0,
      decay: 2, castShadow: false, shadowMapSize: 1024,
      shadowBias: -0.0005, shadowRadius: 1,
      // spot-only
      angleDeg: 25.8, penumbra: 0.3, showHelper: false,
      // position (live)
      posX: 0, posY: 0, posZ: 0,
      targetX: 0, targetY: 0, targetZ: 0,
    };

    const selCtrlList    = [];
    const spotOnlyList   = [];

    // References to position controllers so we can update range after model load
    let posCtrlX = null, posCtrlY = null, posCtrlZ = null;
    let tgtCtrlX = null, tgtCtrlY = null, tgtCtrlZ = null;

    const fSel = fPL.addFolder("Selected Light");

    function addC(c, spotOnly = false) {
      selCtrlList.push(c);
      if (spotOnly) spotOnlyList.push(c);
      return c;
    }

    addC(fSel.add(sel, "type").name("Label").disable());

    addC(fSel.add(sel, "enabled").name("Enabled").onChange(v => {
      if (!selectedLight) return;
      selectedLight.light.visible = v;
      selectedLight.bulbMat.opacity = v ? 1.0 : 0.15;
      selectedLight.ringMat.opacity = v ? 0.6 : 0.1;
      saveLights();
    }));

    addC(fSel.addColor(sel, "color").name("Color").onChange(v => {
      if (!selectedLight) return;
      selectedLight.light.color.set(v);
      selectedLight.bulbMat.color.set(v);
      selectedLight.ringMat.color.set(v);
      if (selectedLight.targetMat) selectedLight.targetMat.color.set(v);
      saveLights();
    }));

    addC(fSel.add(sel, "intensity", 0, 50, 0.1).name("Intensity").onChange(v => {
      if (selectedLight) { selectedLight.light.intensity = v; saveLights(); }
    }));

    addC(fSel.add(sel, "distance", 0, 5000, 10).name("Distance (0 = ∞)").onChange(v => {
      if (selectedLight) { selectedLight.light.distance = v; saveLights(); }
    }));

    addC(fSel.add(sel, "decay", { "None (constant)": 0, "Linear": 1, "Physical (×r²)": 2 }).name("Decay mode").onChange(v => {
      if (selectedLight) { selectedLight.light.decay = Number(v); saveLights(); }
    }));

    // ── Shadows ───────────────────────────────────────────────────────────────
    addC(fSel.add(sel, "castShadow").name("Cast shadows").onChange(v => {
      if (selectedLight) { selectedLight.light.castShadow = v; saveLights(); }
    }));

    addC(fSel.add(sel, "shadowMapSize", [512, 1024, 2048, 4096]).name("Shadow map size").onChange(v => {
      if (!selectedLight?.light?.shadow) return;
      const size = Number(v);
      selectedLight.light.shadow.mapSize.set(size, size);
      selectedLight.light.shadow.map?.dispose();
      selectedLight.light.shadow.map = null;
      saveLights();
    }));

    addC(fSel.add(sel, "shadowBias", -0.05, 0.05, 0.0001).name("Shadow bias").onChange(v => {
      if (selectedLight?.light?.shadow) { selectedLight.light.shadow.bias = v; saveLights(); }
    }));

    addC(fSel.add(sel, "shadowRadius", 0, 16, 0.5).name("Shadow softness").onChange(v => {
      if (selectedLight?.light?.shadow) { selectedLight.light.shadow.radius = v; saveLights(); }
    }));

    // ── Spot-only ─────────────────────────────────────────────────────────────
    addC(fSel.add(sel, "angleDeg", 1, 89, 0.5).name("Cone angle °").onChange(v => {
      if (!selectedLight || selectedLight.type !== "Spot") return;
      const rad = v * Math.PI / 180;
      selectedLight.light.angle = rad;
      selectedLight.light.shadow.camera.fov = v * 2;
      selectedLight.light.shadow.camera.updateProjectionMatrix();
      selectedLight.light.shadow.needsUpdate = true;
      if (selectedLight.helper) selectedLight.helper.update();
      saveLights();
    }), true);

    addC(fSel.add(sel, "penumbra", 0, 1, 0.01).name("Penumbra (edge softness)").onChange(v => {
      if (selectedLight?.type === "Spot") { selectedLight.light.penumbra = v; saveLights(); }
    }), true);

    addC(fSel.add(sel, "showHelper").name("Show cone helper").onChange(v => {
      if (selectedLight?.helper) { selectedLight.helper.visible = v; if (v) selectedLight.helper.update(); }
    }), true);

    // ── Position ──────────────────────────────────────────────────────────────
    const fPos = fSel.addFolder("Light Position");
    posCtrlX = fPos.add(sel, "posX", -1000, 1000, 1).name("X").onChange(v => {
      if (selectedLight) { selectedLight.group.position.x = v; saveLights(); }
    });
    posCtrlY = fPos.add(sel, "posY", -1000, 1000, 1).name("Y").onChange(v => {
      if (selectedLight) { selectedLight.group.position.y = v; saveLights(); }
    });
    posCtrlZ = fPos.add(sel, "posZ", -1000, 1000, 1).name("Z").onChange(v => {
      if (selectedLight) { selectedLight.group.position.z = v; saveLights(); }
    });
    selCtrlList.push(posCtrlX, posCtrlY, posCtrlZ);

    addC(fPos.add({ r: () => { if (selectedLight) { selectedLight.group.position.set(0, sceneDim * 0.45, 0); syncSelGui(); saveLights(); } } }, "r").name("↺ Reset position"));

    // ── Spot: target position ─────────────────────────────────────────────────
    const fTgt = fSel.addFolder("Target Position (Spot)");
    tgtCtrlX = fTgt.add(sel, "targetX", -1000, 1000, 1).name("X").onChange(v => {
      if (selectedLight?.targetGroup) { selectedLight.targetGroup.position.x = v; saveLights(); }
    });
    tgtCtrlY = fTgt.add(sel, "targetY", -1000, 1000, 1).name("Y").onChange(v => {
      if (selectedLight?.targetGroup) { selectedLight.targetGroup.position.y = v; saveLights(); }
    });
    tgtCtrlZ = fTgt.add(sel, "targetZ", -1000, 1000, 1).name("Z").onChange(v => {
      if (selectedLight?.targetGroup) { selectedLight.targetGroup.position.z = v; saveLights(); }
    });
    selCtrlList.push(tgtCtrlX, tgtCtrlY, tgtCtrlZ);
    spotOnlyList.push(fTgt); // hide whole folder for point lights

    addC(fTgt.add({ r: () => { if (selectedLight?.targetGroup) { selectedLight.targetGroup.position.set(0, 0, 0); syncSelGui(); saveLights(); } } }, "r").name("↺ Reset target"), true);

    // ── syncSelGui / syncPosGui ───────────────────────────────────────────────
    function syncPosGui() {
      if (!selectedLight) return;
      const p = selectedLight.group.position;
      sel.posX = parseFloat(p.x.toFixed(1));
      sel.posY = parseFloat(p.y.toFixed(1));
      sel.posZ = parseFloat(p.z.toFixed(1));
      posCtrlX.updateDisplay(); posCtrlY.updateDisplay(); posCtrlZ.updateDisplay();
      if (selectedLight.targetGroup) {
        const t = selectedLight.targetGroup.position;
        sel.targetX = parseFloat(t.x.toFixed(1));
        sel.targetY = parseFloat(t.y.toFixed(1));
        sel.targetZ = parseFloat(t.z.toFixed(1));
        tgtCtrlX.updateDisplay(); tgtCtrlY.updateDisplay(); tgtCtrlZ.updateDisplay();
      }
    }

    function syncSelGui() {
      if (selectedLight) {
        const l   = selectedLight.light;
        const idx = lights.indexOf(selectedLight) + 1;
        sel.type         = `Light ${idx} — ${selectedLight.type}`;
        sel.enabled      = l.visible !== false;
        sel.color        = "#" + l.color.getHexString();
        sel.intensity    = l.intensity;
        sel.distance     = l.distance;
        sel.decay        = l.decay;
        sel.castShadow   = l.castShadow;
        sel.shadowMapSize = l.shadow?.mapSize.x ?? 1024;
        sel.shadowBias   = l.shadow?.bias   ?? -0.0005;
        sel.shadowRadius = l.shadow?.radius ?? 1;
        if (selectedLight.type === "Spot") {
          sel.angleDeg   = parseFloat((l.angle * 180 / Math.PI).toFixed(1));
          sel.penumbra   = l.penumbra;
          sel.showHelper = selectedLight.helper?.visible ?? false;
        }
      } else {
        sel.type = "— none selected —";
      }
      selCtrlList.forEach(c => c.updateDisplay?.());
      syncPosGui();
      // Show/hide spot-only controls
      const isSpot = selectedLight?.type === "Spot";
      spotOnlyList.forEach(c => {
        const el = c.domElement ?? c.$title?.parentElement;
        if (el) el.style.display = isSpot ? "" : "none";
      });
    }

    // ── Scene settings ────────────────────────────────────────────────────────
    const fScene = gui.addFolder("Scene");
    fScene.add(params, "background", ["Dark", "Light", "Custom", "Transparent"]).name("Background").onChange(() => { applyBackground(); saveSettings(); });
    fScene.addColor(params, "bgColor").name("Custom color").onChange(() => { if (params.background === "Custom") applyBackground(); saveSettings(); });
    fScene.add(params, "gridVisible").name("Show grid").onChange(() => { applyGrid(); saveSettings(); });
    fScene.add(params, "wireframe").name("Wireframe").onChange(() => { applyMaterials(); saveSettings(); });

    const fRender = gui.addFolder("Render Quality");
    fRender.add(params, "toneMapping", Object.keys(TONE)).name("Tone mapping").onChange(() => { applyToneMapping(); saveSettings(); });
    fRender.add(params, "exposure", 0, 3, 0.01).name("Exposure").onChange(() => { renderer.toneMappingExposure = params.exposure; saveSettings(); });

    gui.add({ r: () => { try { localStorage.removeItem(SETTINGS_KEY); localStorage.removeItem(LIGHTS_KEY); } catch (_) {} location.reload(); } }, "r").name("⟲ Reset everything");

    fSun.close(); fEnv.close(); fRender.close(); fPos.close(); fTgt.close();
    gui.controllersRecursive().forEach(c => c.updateDisplay?.());

    // ── File input / drag-drop ────────────────────────────────────────────────
    el("fileinput").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) loadFromFile(f); e.target.value = ""; });
    const dragmask = el("dragmask");
    let dragDepth = 0;
    window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; dragmask.classList.add("show"); });
    window.addEventListener("dragover",  e => e.preventDefault());
    window.addEventListener("dragleave", e => { e.preventDefault(); if (!--dragDepth) dragmask.classList.remove("show"); });
    window.addEventListener("drop", e => {
      e.preventDefault(); dragDepth = 0; dragmask.classList.remove("show");
      const f = e.dataTransfer.files?.[0];
      if (!f) return;
      if (!/\.(glb|gltf)$/i.test(f.name)) { showError("Please drop a .glb or .gltf file."); return; }
      loadFromFile(f);
    });
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (viewHelper.animating) viewHelper.update(delta);
      controls.update();
      lights.forEach(e => { if (e.helper?.visible) e.helper.update(); });
      renderer.clear();
      renderer.render(scene, camera);
      viewHelper.render(renderer);
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    applyAll();
    const saved = loadSavedLights();
    if (saved?.length) restoreLights(saved);
    else               selectLight(spawnLight("Point", "#ffffff", 4));
    animate();
    loadFromURL(DEFAULT_MODEL, DEFAULT_MODEL.split("/").pop());
  </script>
</body>
</html>
